[server]
# Cloud Run inyecta la variable PORT; Streamlit la toma del entorno
headless = true
# Protección XSRF activa (requiere CORS habilitado; Streamlit ignora XSRF si CORS=false).
# Cloud Run con sessionAffinity mantiene la cookie XSRF en la misma instancia.
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#1A365D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#2C3E50"
